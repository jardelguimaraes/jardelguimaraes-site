server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas de preview limpas (sem extensao .html)
    location = /v2      { try_files /index-v2.html =404; }
    location = /v3      { try_files /index-v3.html =404; }
    location = /bio-v2  { try_files /bio-v2.html =404; }
    location = /bio-v3  { try_files /bio-v3.html =404; }
    location = /compare { try_files /compare.html =404; }
    location = /bio     { try_files /bio.html =404; }

    # Arquivos estaticos (css, js, img)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Raiz e qualquer outra rota
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
